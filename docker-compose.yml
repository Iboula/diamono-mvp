services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: diamono
      POSTGRES_USER: diamono
      POSTGRES_PASSWORD: diamono_dev
    ports:
      - "5432:5432"
    volumes:
      - diamono_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diamono -d diamono"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  diamono_pg:
